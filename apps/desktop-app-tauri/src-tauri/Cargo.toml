[package]
name = "maczen-desktop-tauri"
version = "0.0.1"
description = "MacZen Tauri shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

[lib]
name = "maczen_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
